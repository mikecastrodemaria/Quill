<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Quill Chat</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class="window">
        <header class="window-header">
            <h1 data-i18n="chatTitle">Quill Chat</h1>
            <span class="chip" id="chat-model"></span>
        </header>
        <main class="window-body">
            <div id="messages" class="messages"></div>
        </main>
        <footer class="window-footer chat-input">
            <textarea id="message-input" data-i18n-placeholder="chatPlaceholder"></textarea>
            <button id="send-button" class="btn primary" data-i18n="chatSend">Send</button>
        </footer>
        <script type="module" src="chat.js"></script>
    </body>
</html>
