<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="settingsTitle">Quill - Settings</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="settings">
      <header class="settings-header">
        <img src="/images/icon-64px.png" alt="">
        <div>
          <h1>Quill</h1>
          <p class="muted small" data-i18n="settingsSubtitle">AI email assistant for Thunderbird</p>
        </div>
      </header>

      <div class="notice" id="prompt-notice" hidden>
        <span data-i18n="warningAvailablePrompts"></span>
        <button class="btn" id="prompt-notice-ignore" data-i18n="warningIgnore">Ignore</button>
      </div>

      <section class="section">
        <h2 data-i18n="settingsProvidersHeading">Providers</h2>
        <p class="hint muted small" data-i18n="settingsProvidersHelp">Enable the providers you want to use.</p>
        <div class="card" id="providers"></div>
      </section>

      <section class="section">
        <h2 data-i18n="settingsGeneralHeading">General</h2>
        <div class="card">
          <div class="field">
            <label for="active-provider" data-i18n="settingsActiveProvider">Active provider</label>
            <div class="control"><select id="active-provider"></select></div>
            <p class="hint muted small" data-i18n="settingsActiveProviderHelp"></p>
          </div>
          <div class="field">
            <label for="language" data-i18n="settingsLanguage">Interface language</label>
            <div class="control">
              <select id="language">
                <option value="en">English</option>
                <option value="fr">Français</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="max-tokens" data-i18n="settingsMaxTokens">Max answer length</label>
            <div class="control">
              <select id="max-tokens">
                <option value="512" data-i18n="settingsTokenVeryShort">Very short (512 tokens)</option>
                <option value="1024" data-i18n="settingsTokenShort">Short (1024 tokens)</option>
                <option value="2048" data-i18n="settingsTokenMedium">Medium (2048 tokens)</option>
                <option value="4096" data-i18n="settingsTokenDefault">Default (4096 tokens)</option>
                <option value="8192" data-i18n="settingsTokenLong">Long (8192 tokens)</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="max-size" data-i18n="settingsMaxInput">Max input (characters)</label>
            <div class="control"><input type="number" id="max-size" min="0" step="1000" placeholder="0"></div>
            <p class="hint muted small" data-i18n="settingsMaxInputHelp"></p>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 data-i18n="settingsCustomActionsHeading">Actions</h2>
        <p class="hint muted small" data-i18n="settingsActionsHelp"></p>
        <div class="card">
          <div id="actions-container"></div>
          <div class="card-footer">
            <button id="add-action" class="btn" data-i18n="settingsAddAction">Add an action</button>
            <button id="restore-actions" class="btn" data-i18n="settingsRestoreActions">Restore default actions</button>
          </div>
        </div>
      </section>

      <p class="about">
        Quill <span id="version"></span> · <span data-i18n="settingsAboutDesc"></span> · GPL-3.0<br>
        <a href="https://github.com/mikecastrodemaria/Quill" target="_blank">GitHub</a> ·
        <a href="https://github.com/mikecastrodemaria/Quill/wiki" target="_blank" data-i18n="settingsDocs">Documentation</a> ·
        <a href="https://github.com/mikecastrodemaria/Quill/issues" target="_blank" data-i18n="settingsReportBug">Report a bug</a>
      </p>
    </div>

    <div class="save-bar">
      <div>
        <button id="default-settings" class="btn danger" data-i18n="settingsReset">Reset everything</button>
        <span class="status" id="save-status" role="status"></span>
        <button id="save-settings" class="btn primary" data-i18n="settingsSave">Save</button>
      </div>
    </div>

    <script type="module" src="settings.js"></script>
  </body>
</html>
