<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Quill</title>
        <link rel="stylesheet" href="styles.css">
        <script type="module" src="draft.js"></script>
    </head>
    <body class="window">
        <header class="window-header">
            <h1 id="draft-title">Quill</h1>
            <span class="chip" id="draft-model"></span>
        </header>
        <main class="window-body" id="draft-container"></main>
        <footer class="window-footer">
            <button id="regenerate" class="btn" data-i18n="draftRegenerate">Regenerate</button>
            <button id="chat-button" class="btn" data-i18n="draftToChat">Continue in chat</button>
            <span class="spacer"></span>
            <button id="copy-button" class="btn" data-i18n="draftCopy">Copy</button>
            <button id="insert-button" class="btn primary" data-i18n="draftInsert">Insert</button>
        </footer>
    </body>
</html>
